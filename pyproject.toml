[project]
name = "rubik-ml-solver"
version = "0.1.0"
description = "Rubik's Cube study and ML-based solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rubik"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
